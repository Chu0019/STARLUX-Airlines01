<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星宇航空追蹤設定</title>
    <link rel="stylesheet" href="styles.css?v=pi-watch-1" />
  </head>
  <body>
    <main class="board watch-board admin-board" aria-label="星宇航空追蹤設定">
      <section class="watch-controls" aria-label="指定航班輸入">
        <form id="watchForm" class="watch-form">
          <label for="flightInput">追蹤航班</label>
          <input id="flightInput" type="text" autocomplete="off" />
          <button type="submit">追蹤</button>
        </form>
      </section>

      <section class="summary" aria-label="更新資訊">
        <div>
          <span>TDX更新</span>
          <strong id="updatedAt">--:--</strong>
          <small id="tdxLastUpdatedAt">上次更新 --:--</small>
        </div>
        <div>
          <span>FR24更新</span>
          <strong id="fr24UpdatedAt">--:--</strong>
          <small id="fr24LastUpdatedAt">上次更新 --:--</small>
        </div>
        <div class="summary-action">
          <button id="forceRefreshButton" type="button">強制更新</button>
          <small id="forceRefreshStatus">只更新追蹤航班</small>
        </div>
      </section>
    </main>

    <script src="watch.js?v=pi-watch-1"></script>
  </body>
</html>
